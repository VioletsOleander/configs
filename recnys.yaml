{
  # Shells
  ".bashrc.template": { dest: { Windows: "", Linux: "my_bashrc" } },
  "nushell/",
  "nushell/autoload/net.nu.template",
  # Terminals
  "windows-terminal/": {
    dest: {
      Windows: "AppData/Local/Microsoft/Windows Terminal/",
      Linux: "",
    },
  },
  "alacritty/",
  "wezterm/": { dest: { Windows: ".config/wezterm/" } },
  # Editors
  "nvim/": { dest: { Windows: "AppData/Local/nvim/" } },
  "vim/": { dest: { Windows: "vimfiles/" } },
  "vscode/settings.json": {
    dest: {
      Windows: "AppData/Roaming/Code/User/settings.json",
      Linux: ".config/Code/User/settings.json",
    },
  },
  "vscode/keybindings.json": {
    dest: {
      Windows: "AppData/Roaming/Code/User/keybindings.json",
      Linux: ".config/Code/User/keybindings.json",
    },
  },
  # Tools
  ".gitconfig": { dest: { Windows: ".gitconfig", Linux: ".gitconfig" } },
  ".inputrc": { dest: { Windows: "", Linux: ".inputrc" } },
  ".lesskey": { dest: { Windows: "_lesskey", Linux: ".lesskey" } },
  ".tmux.conf": { dest: { Windows: "", Linux: ".tmux.conf" } },
  ".tridactylrc": { dest: { Windows: ".tridactylrc", Linux: ".tridactylrc" } },
  "yazi/config/",
  "lazygit/",
  "vivid/",
  "dprint/",
}
